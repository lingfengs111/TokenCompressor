defaults:
  - dataset: xlong2018
  - model: decoder_only
  - hydra: default
  - hydra/job_logging: colorlog
  - hydra/hydra_logging: colorlog
  - _self_

# Patch
L_soft: 50
num_patches: 30
patch_routing: kmeans_per_user
patch_seed: null
kmeans_max_iters: 25
user_embedding_method: mean
user_embedding_decay: 1.0

# Reproducibility / compute
seed: 2026
deterministic: false
tf32_enabled: false
vectorized_neg_sampling: true

# Training
inner_batch_size: 256
outer_batch_size: 256
inner_steps: 5
inner_lr: 0.0001
inner_momentum: 0.9
inner_grad_clip: 0.0
inner_reset_every_outer: 200
inner_reset_every_inner: 0
outer_max_lr: 0.0001
outer_min_lr: 0.00001
outer_scheduler_type: cosine_with_warmup
outer_warmup_steps: 30
outer_warmup_start_lr: 0.0000001
outer_grad_clip: 0.1
weight_decay: 0.0
meta_truncate_steps: 4
outer_update_every: 3
max_iters: 5000
log_every: 50
debug_nan_checks: true
lambda_direct: 1.0
lambda_meta: 1.0
outer_use_patch: false

# Logging
wandb_enabled: true
wandb_project: mixflow-id3
wandb_run_name: 30patch_kmeans_1000neg_decoder_only_recent50_full500_inner_reset200_noouterpatch

# Checkpointing
checkpoint_dir: checkpoints/mixflow_id
keep_best_k: 1
load_best_for_test: true

# Evaluation (FME)
fme_eval_every: 700
fme_lr: 0.0001
fme_weight_decay: 0.0
fme_patience: 3
early_stop_patience: 4
fme_train_num_negatives: 200
fme_train_epochs: 10
fme_test_num_negatives: 400
fme_test_epochs: 30
fme_long_epochs: 45
fme_batch_size: 256
fme_max_train_batches: 200
fme_max_val_batches: 50
final_test_eval: true
run_fme_short_only: false
run_fme_long_only: false
run_main_training: true
fme_show_progress: true
