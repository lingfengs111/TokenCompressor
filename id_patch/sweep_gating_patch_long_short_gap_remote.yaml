    value: true
  inner_drop_prefix:
    value: true
  inner_seq_length:
    value: 20
  eval_seq_length:
    value: 20
  inner_steps:
    value: 2
  inner_lr:
    value: 1e-4
  inner_reset_every:
    values: [0, 200, 500, 1000]
  outer_neg_samples:
    value: 5
  outer_mid_weight:
    value: 1.0
  outer_mid_samples:
    value: 0
  outer_tail_weight:
    value: 1.0
  eval_after_train:
    value: false
  eval_sample_size:
    value: 1000
  val_eval_every_epochs:
    value: 4
  batch_size:
    value: 1024
  num_workers:
    value: 1
  pin_memory:
    value: true
  persistent_workers:
    value: true
