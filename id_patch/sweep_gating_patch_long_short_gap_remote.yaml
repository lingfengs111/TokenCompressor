program: /u/lshi8/TokenCompressor/id_patch/train_gating_patch_long_short_remote.py
project: gating_patch_long_short-taobao_loo202_remote
method: random
metric:
  name: val/meta_patch_ndcg@10
  goal: maximize
command:
  - ${env}
  - ${interpreter}
  - -u
  - ${program}
parameters:
  device:
    value: "cuda:0"
  seed:
    value: 2026
  checkpoint_mode:
    value: "delta"
  patch_routing:
    values: ["learned", "user_table"]
  num_patches:
