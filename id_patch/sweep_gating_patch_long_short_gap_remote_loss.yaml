program: /u/lshi8/TokenCompressor/id_patch/train_gating_patch_long_short_remote.py
project: gating_patch_long_short-taobao_loo202_remote
method: random
metric:
  name: val/meta_patch_ndcg@10
  goal: maximize
command:
  - ${env}
  - ${interpreter}
  - -u
  - ${program}
parameters:
  device:
    value: "cuda:0"
  seed:
    value: 2026
  checkpoint_mode:
    value: "delta"

  # Fixed architecture (from best run pattern)
  patch_routing:
    value: "learned"
  num_patches:
    value: 16
  patch_len:
    value: 12
  prefix_len:
    value: 0
  prefix_tail_positions:
    value: true
  patch_after_prefix:
    value: true
  inner_drop_prefix:
    value: true
  inner_seq_length:
    value: 20
  eval_seq_length:
    value: 20
  inner_steps:
    value: 2
  meta_truncate_steps:
    value: 1
  inner_lr:
    value: 1e-4
  inner_reset_every:
    value: 200
  outer_neg_samples:
    value: 5

  # Loss sweep
  outer_tail_weight:
    values: [0.5, 1.0]
  outer_mid_weight:
    values: [0.0, 0.5, 1.0]
  outer_mid_samples:
    value: 0
  outer_gt_weight:
    values: [0.0, 0.5, 1.0]
  outer_mid_rel_weight:
    values: [0.0, 0.05, 0.1]

  eval_after_train:
    value: false
  eval_sample_size:
    value: 1000
  val_eval_every_epochs:
    value: 4
  batch_size:
    value: 1024
  num_workers:
    value: 1
  pin_memory:
    value: true
  persistent_workers:
    value: true
