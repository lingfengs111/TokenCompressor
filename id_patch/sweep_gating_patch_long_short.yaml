program: /home/lingfengs111/codes/soft_patch_training/id_patch/train_gating_patch_long_short.py
project: gating_patch_long_short-taobao_loo202
method: random
metric:
  name: val/meta_patch_ndcg@10
  goal: maximize
command:
  - ${env}
  - ${interpreter}
  - -u
  - ${program}
parameters:
  device:
    value: "cuda:0"
  eval_after_train:
    value: false
  checkpoint_mode:
    value: "delta"
  eval_sample_size:
    value: 1000
  val_eval_every_epochs:
    value: 4
  num_workers:
    value: 4
  pin_memory:
    value: true
  persistent_workers:
    value: true
  inner_lr:
    distribution: log_uniform_values
    min: 1e-6
    max: 5e-4
  outer_lr:
    distribution: log_uniform_values
    min: 1e-5
    max: 5e-4
  outer_update_every:
    values: [20, 30, 40, 50]
  inner_steps:
    values: [1, 2, 3]
  num_patches:
    values: [2, 4, 6, 8, 10, 12, 16, 24, 32]
  patch_len:
    values: [4, 8, 12, 16, 20, 24, 30, 40]
  gating_temperature:
    distribution: uniform
    min: 0.3
    max: 1.0
  gating_noise_std:
    distribution: uniform
    min: 0.0
    max: 0.05
  outer_loss_mode:
    value: "decay"
  outer_loss_decay:
    distribution: uniform
    min: 0.7
    max: 0.95
  outer_neg_samples:
    values: [1, 5]
  inner_seq_length:
    value: 50
  eval_seq_length:
    value: 50
  seed:
    value: 2026
  batch_size:
    value: 1024
  patch_routing:
    value: "user_table"
